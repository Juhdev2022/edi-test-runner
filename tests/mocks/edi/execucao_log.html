            { nome: "Conectar servidor", status: "SUCESSO", mensagem: null, duracaoSegundos: 10 },

        REGRA_DOWNLOAD_SFTP_05: {
          resultado: "FALHA",
          etapas: [
            {
              nome: "Preparar arquivo local",
              status: "FALHA",
              mensagem: "Diretório de origem inacessível — verifique permissões",
              duracaoSegundos: 120,
            },
            { nome: "Conectar servidor", status: "PULADA", mensagem: null, duracaoSegundos: 0 },
            { nome: "Baixar arquivo", status: "PULADA", mensagem: null, duracaoSegundos: 0 },

            { nome: "Conectar servidor", status: "SUCESSO", mensagem: null, duracaoSegundos: 30 },

        REGRA_VALIDACAO_ASSINATURA_08: {

            { nome: "Conectar servidor", status: "SUCESSO", mensagem: null, duracaoSegundos: 5 },

            {
              nome: "Validar recebimento no destino",
              status: "SUCESSO",
              mensagem: null,
              duracaoSegundos: 5,
            },
          ],
        },
      };

      const params = new URLSearchParams(window.location.search);
      const idRegra = params.get("id");
      const logEntry = LOGS[idRegra] || null;

      window.__logExecucao = logEntry;

      const logEl = document.getElementById("log-edi");
      if (logEntry) {
        const timestampBase = new Date("2026-07-31T10:00:00Z").getTime();
        logEl.textContent = logEntry.etapas
          .map(function (etapa, indice) {
            const timestamp = new Date(timestampBase + indice * 1000).toISOString();
            return `[${timestamp}] ${etapa.nome}: ${etapa.status}`;
          })
          .join("\n");
      } else {
        logEl.textContent = `Nenhum log encontrado para "${idRegra}".`;
      }
    </script>
  </body>
</html>
